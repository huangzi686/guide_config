<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>意向分支配置（可在线编辑）</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --line: #e5e7eb;
        --text: #2f3542;
        --muted: #8b95a7;
        --green-bg: #d9f2de;
        --green-text: #1f8a3d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .page {
        max-width: 820px;
        margin: 0 auto;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        overflow: hidden;
      }

      .row {
        padding: 18px 20px;
        border-bottom: 1px dashed #d9dde5;
      }

      .row:last-child {
        border-bottom: none;
      }

      .title {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 10px;
      }

      .hint {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .editable {
        outline: none;
        border-radius: 6px;
        transition: background 0.15s ease;
      }

      .editable[contenteditable="true"]:focus {
        background: #fffce8;
      }

      .input,
      .textarea,
      .select,
      .small-input {
        width: 100%;
        border: 1px solid #d2d8e2;
        border-radius: 8px;
        background: #fff;
        font-size: 15px;
        color: #222;
        padding: 11px 12px;
        outline: none;
      }

      .textarea {
        min-height: 120px;
        resize: vertical;
        line-height: 1.55;
      }

      .header-green {
        background: var(--green-bg);
        color: var(--green-text);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
      }

      .delete {
        border: none;
        background: transparent;
        color: #7f9687;
        font-size: 18px;
        cursor: pointer;
      }

      .label {
        color: #7b8796;
        font-size: 15px;
        margin-bottom: 8px;
      }

      .inline {
        display: flex;
        gap: 10px;
      }

      .inline .select {
        width: 150px;
        flex-shrink: 0;
      }

      .toggle-wrap {
        margin-top: 10px;
        border: 1px solid #e1e5ec;
        border-radius: 8px;
        padding: 10px 12px;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .switch {
        position: relative;
        width: 44px;
        height: 24px;
        display: inline-block;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: #d1d5db;
        transition: 0.2s;
        cursor: pointer;
      }

      .slider::before {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        left: 3px;
        top: 3px;
        border-radius: 50%;
        background: #fff;
        transition: 0.2s;
      }

      .switch input:checked + .slider {
        background: #45b26b;
      }

      .switch input:checked + .slider::before {
        transform: translateX(20px);
      }

      .counter-row {
        position: relative;
      }

      .counter {
        position: absolute;
        right: 12px;
        bottom: 11px;
        color: #8b95a7;
        font-size: 13px;
      }

      .btn-dashed {
        margin-top: 14px;
        width: 100%;
        border: 1px dashed #c8d0dc;
        border-radius: 8px;
        padding: 12px;
        background: #fff;
        color: #5f6b7f;
        font-size: 16px;
        cursor: pointer;
      }

      .section-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="panel">
        <section class="row">
          <div class="title editable" contenteditable="true">① 触发当前分支的条件</div>
          <div class="hint editable" contenteditable="true">判定为该意向时进入此分支：</div>
          <input class="input" value="例如“预订”、“高意向”" />
        </section>

        <section class="row">
          <div class="title editable" contenteditable="true">② 达成后的 AI 回复（前端动作）</div>
          <div class="inline" style="margin-bottom: 10px;">
            <select class="select">
              <option>提示词</option>
              <option>素材</option>
            </select>
            <input class="small-input" value="可编辑说明：此下拉用于切换回复类型" />
          </div>
          <textarea class="textarea">请输入AI在此节点完成时要说的话...</textarea>

          <div class="toggle-wrap">
            <div class="toggle-row">
              <div class="editable" contenteditable="true">💡 若用户提前达成目标，依然发送上述回复</div>
              <label class="switch" aria-label="toggle">
                <input type="checkbox" checked />
                <span class="slider"></span>
              </label>
            </div>
            <div class="hint editable" contenteditable="true" style="margin-top: 8px; margin-bottom: 0;">
              关闭时，若用户在进入本阶段前已完成目标，AI将保持沉默直接进入下一阶段。
            </div>
          </div>
        </section>

        <section class="row">
          <div class="title editable" contenteditable="true">③ 自动执行的系统任务（后端动作）</div>

          <div class="section-title editable" contenteditable="true">🏷 自动打标（原Pms标签）</div>
          <button class="btn-dashed editable" contenteditable="true">+ 选择要给用户打上的客户标签</button>

          <div class="section-title editable" contenteditable="true" style="margin-top: 14px;">🔔 提醒销售</div>
          <div class="counter-row">
            <input id="salesText" class="input" maxlength="30" value="请输入要发送给销售的企微/系统提醒文案..." />
            <span id="count" class="counter">0 / 30</span>
          </div>
        </section>
      </div>

      <button class="btn-dashed editable" contenteditable="true" style="margin-top: 16px;">➕ 添加其他意向分支</button>
    </main>

    <script>
      const input = document.getElementById('salesText');
      const count = document.getElementById('count');
      function updateCount() {
        count.textContent = `${input.value.length} / 30`;
      }
      input.addEventListener('input', updateCount);
      updateCount();
    </script>
  </body>
</html>
